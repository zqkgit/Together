services:
  mysql:
    image: mysql:8.4
    container_name: together_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: together
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: together_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: together_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: >
      sh -c "node src/utils/wait-for-db.js &&
      npm run db:migrate &&
      npm run db:seed:demo &&
      npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: /v1
      ADMIN_PREFIX: /admin
      FRONTEND_URL: http://127.0.0.1:5173
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: together
      DB_NAME_TEST: together_test
      DB_USER: root
      DB_PASSWORD: 123456
      DB_LOGGING: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-me
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

volumes:
  mysql_data:
  redis_data:
  api_node_modules:
